# Claude Code などの OpenTelemetry をローカルで受ける Grafana LGTM（開発・検証用）。
# grafana/otel-lgtm は Grafana / Loki / Prometheus / Tempo / OTel Collector を 1 コンテナにまとめたイメージ。
services:
  lgtm:
    image: grafana/otel-lgtm:0.34.0
    container_name: otel-lgtm
    # Docker Desktop が起動していれば、PC を再起動しても自動で立ち上がる
    restart: unless-stopped
    ports:
      # LAN に公開しないよう 127.0.0.1 にだけ bind する
      - "127.0.0.1:3333:3000" # Grafana UI（3000 は Next.js 等とぶつかりやすいので 3333 に逃がす）
      - "127.0.0.1:4317:4317" # OTLP gRPC
      - "127.0.0.1:4318:4318" # OTLP HTTP
    environment:
      # 未設定なら admin / admin。変えたいときは .env に GF_SECURITY_ADMIN_PASSWORD を書く
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      # Claude Code はメトリクスを delta temporality で送る。Prometheus の OTLP receiver は
      # 既定では delta を "invalid temporality and type combination" で拒否するので、delta のまま保存させる。
      # 期間内の合計は increase() ではなく sum_over_time() で出す（セッションごとに系列が分かれ、点が少ないため）
      PROMETHEUS_EXTRA_ARGS: --enable-feature=otlp-native-delta-ingestion
    volumes:
      # 各コンポーネントは /data に書く。コンテナを作り直してもデータを残す
      - lgtm-data:/data
      # Claude Code のダッシュボードをプロビジョニングする
      - ./grafana/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/claude-code.yaml:ro
      - ./grafana/dashboards:/otel-lgtm/dashboards/claude-code:ro

volumes:
  lgtm-data:
